[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is injected in migrations/env.py from server.infra.config (DATA_DIR aware)
# NOTE: keep this file ASCII-only (configparser reads it with locale encoding on Windows)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
